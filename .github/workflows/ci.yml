name: ARCA CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend · lint y pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check arca tests scripts alembic/env.py
      - run: python -m pytest -q

  frontend:
    name: Interfaz · tipos y compilación
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  postgres:
    name: Backend · migraciones sobre PostgreSQL
    runs-on: ubuntu-latest
    needs: backend
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arca
          POSTGRES_PASSWORD: arca_ci
          POSTGRES_DB: arca
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arca -d arca" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ARCA_DATABASE_URL: postgresql+psycopg://arca:arca_ci@localhost:5432/arca
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrar, comprobar el esquema y deshacer
        run: |
          alembic upgrade head
          alembic check
          python scripts/crear_operador.py operador@arca.example.com "Operador CI"
          alembic downgrade base
