[project]
name = "arca"
version = "0.1.0"
description = "ARCA: plataforma SaaS de gestión archivística, digitalización masiva y automatización documental"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Motor reciclado de GEOLOGY: se conserva tal cual para no alterar reglas ya probadas en producción.
"arca/motor/**" = ["B904", "B905"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form", "arca.api.deps.requiere"]
