# ARCA en un servidor (D-45). Uso: cp .env.ejemplo .env; complete el .env; docker compose up -d --build
# Perfiles: «minio» levanta un almacenamiento S3 propio (si no se usa el de la nube).
name: arca

x-backend: &backend
  build: ../backend
  image: arca-backend:latest
  env_file: .env
  environment:
    ARCA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-arca}:${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-arca}
  volumes:
    - almacen:/datos/almacen
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-arca}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arca} -d ${POSTGRES_DB:-arca}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrar:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *backend
    depends_on:
      migrar:
        condition: service_completed_successfully

  trabajador:
    <<: *backend
    command: ["python", "-m", "arca.modulos.flujo.trabajador"]
    healthcheck:
      disable: true
    deploy:
      replicas: ${ARCA_TRABAJADORES:-2}
    depends_on:
      migrar:
        condition: service_completed_successfully

  web:
    build:
      context: ../frontend
      args:
        ARCA_API_URL: http://api:8000
    image: arca-web:latest
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    environment:
      ARCA_DOMINIO: ${ARCA_DOMINIO:?Falta ARCA_DOMINIO}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - web

  minio:
    image: minio/minio:latest
    profiles: ["minio"]
    command: ["server", "/datos", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-arca}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?Falta AWS_SECRET_ACCESS_KEY}
    volumes:
      - minio:/datos
    restart: unless-stopped

volumes:
  postgres:
  almacen:
  minio:
  caddy_datos:
  caddy_config:
